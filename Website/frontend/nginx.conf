server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # l'API FastAPI (service "api" dans docker-compose.yml). Le resolver de Docker et la variable
    # font réinterroger le DNS : nginx suit l'API si son conteneur est recréé (sinon il garderait l'ancienne adresse).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # React Router : toute autre adresse renvoie l'application (rafraîchir /temperature doit marcher)
    location / {
        try_files $uri /index.html;
    }
}

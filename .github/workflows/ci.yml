name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dépendances système pour pyodbc
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker Compose (démarrage complet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env.example contient ACCEPT_EULA=Y (licences Microsoft SQL Server et pilote ODBC) et un mot de passe de démonstration
      - run: cp .env.example .env
      - name: Construire et démarrer
        run: docker compose up --build --detach
      - name: Attendre l'application (SQL Server met un moment à démarrer)
        run: curl -fsS --retry 60 --retry-delay 5 --retry-connrefused --retry-all-errors http://localhost:8080/api/health
      - name: Vérifier que les données sont servies
        run: |
          curl -fsS http://localhost:8080/api/temperature/trends | python3 -c "import json,sys; rows=json.load(sys.stdin); assert len(rows) == 42, len(rows); print(len(rows), 'tendances de température')"
          curl -fsS http://localhost:8080/api/precipitation/anomalies | python3 -c "import json,sys; rows=json.load(sys.stdin); assert len(rows) == 364, len(rows); print(len(rows), 'anomalies de précipitations')"
          curl -fsS http://localhost:8080/temperature | grep -q '<div id="root">'
      - name: "Image de la démo en ligne (Render) : mêmes réponses que SQL Server"
        run: |
          docker build -f deploy/render/Dockerfile -t demo .
          docker run -d --name demo -p 8001:10000 -e PORT=10000 demo
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8001/api/health
          python3 deploy/compare_backends.py http://localhost:8080 http://localhost:8001
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
